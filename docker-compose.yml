# ---------------------------------------------------------------------------
# LOCAL bot deployment (local dev).
# For PROD (Dockploy), prefer the Dockerfile + environment variables
# (CREDENTIALS_JSON / TOKEN_JSON in base64) — see README.
#
# Launch:  docker compose up --build
# ---------------------------------------------------------------------------
services:
  mail-bot:
    build: .
    image: gmail-discord-embed:latest
    restart: unless-stopped
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
      - ./.env:/app/.env:ro
      - ./seen.json:/app/seen.json
